activation_steps_append = ["For this reference/static/fixture BMAD task, read docs/engineering-memory/PROJECT_STATE.md, run `git rev-parse HEAD` and `git status --short`, compare exact source, and preserve unfinished work. Do not infer current PASS or permissions from historical state."]
